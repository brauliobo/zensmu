name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/publish (e.g. v0.2.0)"
        required: true
        type: string
      only_dkms:
        description: "Only build & attach optional ryzen-smu-dkms (.deb/.rpm) packages"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build zensmu Packages (.tar.gz, .deb, .rpm, .pkg.tar.zst)
    if: ${{ !inputs.only_dkms }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            zstd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify fmt, clippy, and workspace tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Generate shell completions & stage tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist/completions
          ./target/release/zensmu completions bash > dist/completions/zensmu.bash
          ./target/release/zensmu completions zsh  > dist/completions/_zensmu
          ./target/release/zensmu completions fish > dist/completions/zensmu.fish

          STAGE_NAME="zensmu-v${VERSION}-x86_64-unknown-linux-gnu"
          STAGE_DIR="$(mktemp -d)"
          STAGE="${STAGE_DIR}/${STAGE_NAME}"
          mkdir -p "${STAGE}/packaging/systemd" "${STAGE}/packaging/polkit"
          cp target/release/zensmu target/release/zensmu-gui "${STAGE}/"
          cp packaging/systemd/zensmu-apply.service packaging/systemd/zensmu-record.service packaging/systemd/zensmu-resume "${STAGE}/packaging/systemd/"
          cp packaging/polkit/org.zensmu.policy "${STAGE}/packaging/polkit/"
          cp README.md LICENSE "${STAGE}/"

          tar -C "${STAGE_DIR}" -czf "dist/${STAGE_NAME}.tar.gz" "${STAGE_NAME}"
          rm -rf "${STAGE_DIR}"

      - name: Install nFPM
        run: |
          NFPM_VER="2.41.2"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build .deb, .rpm, and .pkg.tar.zst packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          nfpm package --config packaging/nfpm/nfpm.yaml --packager deb --target "dist/zensmu_${VERSION}_amd64.deb"
          nfpm package --config packaging/nfpm/nfpm.yaml --packager rpm --target "dist/zensmu-${VERSION}-1.x86_64.rpm"
          nfpm package --config packaging/nfpm/nfpm.yaml --packager archlinux --target "dist/zensmu-${VERSION}-1-x86_64.pkg.tar.zst"

      - name: Generate SHA256 checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd dist
          sha256sum "zensmu-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" > "zensmu-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256"
          sha256sum \
            "zensmu-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "zensmu_${VERSION}_amd64.deb" \
            "zensmu-${VERSION}-1.x86_64.rpm" \
            "zensmu-${VERSION}-1-x86_64.pkg.tar.zst" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          FILES=(
            "dist/zensmu-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/zensmu-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "dist/zensmu_${VERSION}_amd64.deb"
            "dist/zensmu-${VERSION}-1.x86_64.rpm"
            "dist/zensmu-${VERSION}-1-x86_64.pkg.tar.zst"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --title "zensmu ${TAG}" \
              --generate-notes
          fi

  build-ryzen-smu-dkms:
    name: Build Optional ryzen-smu-dkms Packages (.deb, .rpm)
    needs: [build-and-publish]
    if: ${{ always() && (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install nFPM
        run: |
          NFPM_VER="2.41.2"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Fetch upstream amkillam/ryzen_smu and prepare DKMS package files
        id: smu
        run: bash packaging/nfpm/prepare-ryzen-smu-dkms.sh

      - name: Build ryzen-smu-dkms .deb and .rpm packages
        env:
          RYZEN_SMU_VERSION: ${{ steps.smu.outputs.version }}
        run: |
          nfpm package --config packaging/nfpm/ryzen-smu-dkms.yaml --packager deb \
            --target "dist/ryzen-smu-dkms_${RYZEN_SMU_VERSION}_all.deb"
          nfpm package --config packaging/nfpm/ryzen-smu-dkms.yaml --packager rpm \
            --target "dist/ryzen-smu-dkms-${RYZEN_SMU_VERSION}-1.noarch.rpm"
          (cd dist && sha256sum "ryzen-smu-dkms_${RYZEN_SMU_VERSION}_all.deb" "ryzen-smu-dkms-${RYZEN_SMU_VERSION}-1.noarch.rpm" > ryzen-smu-dkms.SHA256SUMS.txt)
          cat dist/ryzen-smu-dkms.SHA256SUMS.txt

      - name: Attach ryzen-smu-dkms packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RYZEN_SMU_VERSION: ${{ steps.smu.outputs.version }}
        run: |
          FILES=(
            "dist/ryzen-smu-dkms_${RYZEN_SMU_VERSION}_all.deb"
            "dist/ryzen-smu-dkms-${RYZEN_SMU_VERSION}-1.noarch.rpm"
            "dist/ryzen-smu-dkms.SHA256SUMS.txt"
          )
          gh release upload "${TAG}" "${FILES[@]}" --clobber
