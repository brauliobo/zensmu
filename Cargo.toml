[workspace]
resolver = "2"
members = [
    "crates/zensmu-core",
    "crates/zensmu-cli",
    "crates/zensmu-gui",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/brauliobo/zensmu"
authors = ["Braulio Oliveira <brauliobo@gmail.com>"]

[workspace.dependencies]
zensmu-core = { path = "crates/zensmu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
ratatui = "0.29"
crossterm = "0.28"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.31"
